[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poolsim"
version = "0.2.1"
description = "Python bindings for the Poolsim connection pool sizing CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gregorian Rayne", email = "gregorianrayne09@gmail.com" }]
keywords = ["connection-pool", "capacity-planning", "sizing", "queueing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["poolsim*"]
