name: Publish Python

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from the root VERSION file to publish
        required: true
        type: string
      dry_run:
        description: Build and validate without publishing to PyPI
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-python:
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify requested version matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < VERSION)"
          requested_version="${{ inputs.version }}"
          if [[ "$requested_version" != "$expected_version" ]]; then
            echo "workflow input version '$requested_version' does not match VERSION '$expected_version'" >&2
            exit 1
          fi

      - name: Validate version sync
        run: python3 tools/sync_version.py --check

      - name: Build and validate Python package
        run: |
          python3 -m pip install --upgrade build twine
          PYTHONPATH=bindings/python python3 -m unittest discover -s bindings/python/tests
          python3 -m build bindings/python
          python3 -m twine check bindings/python/dist/*

      - name: Verify PyPI token is configured
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PYPI_API_TOKEN:-}" ]]; then
            echo "PYPI_API_TOKEN is not configured" >&2
            exit 1
          fi

      - name: Publish Python package to PyPI
        if: ${{ inputs.dry_run != true }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: bindings/python/dist
